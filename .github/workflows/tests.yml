# Имя workflow, которое будет отображаться в интерфейсе GitHub Actions
name: API tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  # Джоба для запуска автотестов
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий с тестовым проектом
      - name: Check out repository
        uses: actions/checkout@v7

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 3. Клонируем репозиторий с тестовым сервером в рабочую среду
      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4. Устанавливаем python-зависимости проекта тестового сервера
      - name: Install test server dependencies
        run: pip install -r qa-automation-engineer-api-course/requirements.txt

      # 5. Запускаем тестовый сервер с необходимыми переменными окружения
      - name: Start a test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir ./qa-automation-engineer-api-course &

      # 6. Устанавливаем python-зависимости тестового проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Запускаем тесты и генерируем allure-results
      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 8. Восстанавливаем историю покрытия из кеша
      - name: Restore Coverage history
        uses: actions/cache/restore@v6
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}
          restore-keys: |
            coverage-history-

      # 9. Генерируем HTML-отчет и обновляем историю
      - name: Generate Coverage report
        run: |
          swagger-coverage-tool save-report

      # 10. Сохраняем историю обратно в кеш
      - name: Cache Coverage  history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      # 11. Загружаем HTML-отчет как артефакт
      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html

      # 12. Сохраняем allure-results как артефакт
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results

  # Джоба для публикации отчета
  publish-report:
    runs-on: ubuntu-latest

    # Запускается только после успешного завершения run-tests
    needs: run-tests

    steps:
      # 1. Клонируем репозиторий с тестовым проектом
      - name: Check out repository
        uses: actions/checkout@v7

      # 2. Загружаем allure-results из артефактов
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      # 3. Получаем историю Allure отчетов, если она существует
      - name: Get Allure history
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 4. Генерируем Allure отчет с историей
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 5. Публикуем отчет на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
